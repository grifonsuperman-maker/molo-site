<body>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color:#ffdd00;"></h3>
            <input type="text" id="name" placeholder="Ваше ім'я" required>
            <input type="tel" id="phone" placeholder="Ваш телефон" required>
            <select id="guests">
                <option value="1">1 особа</option>
                <option value="2" selected>2 особи</option>
                <option value="4">4 особи</option>
                <option value="6">6+ осіб</option>
            </select>
            <input type="time" id="time" required>
            <button class="btn-submit" onclick="submitBooking()">ЗАБРОНЮВАТИ</button>
            <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        let selectedTable = null;

        function scrollToMap() {
            document.getElementById('booking-zone').scrollIntoView({ behavior: 'smooth' });
        }

        function openModal(tableNum) {
            if(document.getElementById(`t${tableNum}`).classList.contains('booked')) return;
            selectedTable = tableNum;
            document.getElementById('modal-title').innerText = `Бронювання: Стіл ${tableNum}`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function submitBooking() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const guests = document.getElementById('guests').value;
            const time = document.getElementById('time').value;
            const date = document.getElementById('date').value;

            if(!name || !phone || !time || !date) { alert("Будь ласка, заповніть всі поля!"); return; }

            tg.sendData(JSON.stringify({ table: selectedTable, name, phone, guests, time, date }));
            tg.close();
        }
    </script>
