name: Admin panel check

on:
  pull_request:
    branches: [main]

concurrency:
  group: admin-panel-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Build frontend
        shell: bash
        run: set -o pipefail; npm --prefix frontend run build 2>&1 | tee frontend-build.log
      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend-build.log
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies from public npm
        run: npm --prefix backend install --package-lock=false --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        shell: bash
        run: set -o pipefail; npm --prefix backend run build 2>&1 | tee backend-build.log
      - name: Upload backend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: backend-build.log
