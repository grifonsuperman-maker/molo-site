name: Apply PR203 booking lock fix

on:
  push:
    branches:
      - fix/guest-visit-identity

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-visit-identity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply scoped locking fix and regression assertion
        run: python3 .github/scripts/fix-pr203-booking-lock.py

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build backend
        run: npm --prefix backend run build

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend
        run: npm --prefix backend test

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Check diff
        run: git diff --check

      - name: Commit verified fix and remove one-off files
        run: |
          rm .github/workflows/fix-pr203-booking-lock.yml
          rm .github/scripts/fix-pr203-booking-lock.py
          git add backend/src/bookings/bookings.service.ts backend/test/booking-completion-actor.test.js .github/workflows/fix-pr203-booking-lock.yml .github/scripts/fix-pr203-booking-lock.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: lock only booking row on completion"
          git show --check HEAD
          git push origin HEAD:fix/guest-visit-identity
