name: Apply guest back navigation patch

on:
  push:
    branches:
      - fix/guest-back-navigation
    paths:
      - .github/workflows/apply-guest-back-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply scoped patch
        run: python .github/scripts/apply-guest-back-navigation.py
      - name: Remove temporary patch tooling
        run: rm .github/scripts/apply-guest-back-navigation.py .github/workflows/apply-guest-back-navigation.yml
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: git diff --check
      - name: Commit scoped change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/guest/GuestApp.tsx frontend/package.json frontend/test/guest-back-navigation.test.cjs .github/scripts/apply-guest-back-navigation.py .github/workflows/apply-guest-back-navigation.yml
          git diff --cached --check
          git commit -m "fix: improve guest back navigation"
          git show --check HEAD
          git push
