name: Fix guest back label guard

on:
  push:
    branches:
      - fix/guest-back-navigation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/guest-back-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Apply Codex label guard fix
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/guest/GuestApp.tsx')
          text = app.read_text()
          old = "target?.closest('input, textarea, select, button, a, [role=\"button\"]')"
          new = "target?.closest('input, textarea, select, button, a, label, [role=\"button\"]')"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one swipe interactive selector, found {text.count(old)}')
          app.write_text(text.replace(old, new, 1))

          test = Path('frontend/test/guest-back-navigation.test.cjs')
          test_text = test.read_text()
          anchor = "  assert.match(source, /touch\\.clientX > 64/);\n"
          addition = anchor + "  assert.ok(source.includes(`target?.closest('input, textarea, select, button, a, label, [role=\\\"button\\\"]')`));\n  assert.equal(source.includes(`target?.closest('input, textarea, select, button, a, [role=\\\"button\\\"]')`), false);\n"
          if test_text.count(anchor) != 1:
              raise SystemExit(f'Expected one touch edge assertion, found {test_text.count(anchor)}')
          test.write_text(test_text.replace(anchor, addition, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-guest-back-label.yml
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build backend
        run: npm --prefix backend run build
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test backend
        run: npm --prefix backend test
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/guest/GuestApp.tsx frontend/test/guest-back-navigation.test.cjs .github/workflows/fix-guest-back-label.yml
          git commit -m "fix: ignore labels for guest back swipe"
          git show --check HEAD
          git push origin HEAD:fix/guest-back-navigation
