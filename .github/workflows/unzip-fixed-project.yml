name: Unzip fixed MOLO project

on:
  push:
    branches:
      - main
    paths:
      - 'molo-restaurant-deploy-ready-fixed.zip'
      - '.github/workflows/unzip-fixed-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip fixed project
        run: |
          if [ ! -f "molo-restaurant-deploy-ready-fixed.zip" ]; then
            echo "Fixed ZIP file not found"
            exit 1
          fi

          rm -rf backend frontend database
          rm -rf /tmp/molo-unzip
          mkdir -p /tmp/molo-unzip

          unzip -o molo-restaurant-deploy-ready-fixed.zip -d /tmp/molo-unzip

          cp -R /tmp/molo-unzip/molo-restaurant/. ./

          rm -f molo-restaurant-deploy-ready-fixed.zip

      - name: Commit fixed unzipped project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Unzip fixed MOLO project" || echo "No changes to commit"

          git push
