name: Verify waiter and guest fixes

on:
  push:
    branches:
      - fix/waiter-transfer-guest-actions-final2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/waiter-transfer-guest-actions-final2
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund --package-lock=false

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install backend dependencies
        run: |
          npm --prefix backend install --include=dev --no-audit --no-fund --package-lock=false
          npm --prefix backend install --no-save @nestjs/cli@10.4.9 --no-audit --no-fund --package-lock=false

      - name: Build backend
        run: npm --prefix backend run build

      - name: Check commit whitespace
        run: git diff --check origin/main...HEAD
