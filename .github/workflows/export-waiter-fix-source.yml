          Path('backend/src/bookings/bookings.service.spec.ts').write_text(bookings_spec, encoding='utf-8')

          waiter_spec = r'''import { strict as assert } from 'node:assert';
          import { test } from 'node:test';

          import { WaiterCallsService } from './waiter-calls.service';

          function historyRepository(history: any = null) {
            return {
              create: (value: any) => value,
              save: async (value: any) => value,
              createQueryBuilder: () => ({
                leftJoin() { return this; },
                where() { return this; },
                andWhere() { return this; },
                orderBy() { return this; },
                getOne: async () => history,
              }),
            };
          }

          test('moveBookingToTable keeps active call and waiter assignment on the new table', () => {
            const service = new WaiterCallsService({} as any, historyRepository() as any);
            (service as any).calls = [{
              id: 'call', bookingId: 'booking', tableId: 'old', tableNumber: '8', clientName: null,
              waiterId: 'waiter-1', waiterName: 'Олександр', status: 'new', createdAt: new Date().toISOString(),
              acceptedAt: null, closedAt: null,
            }];
            (service as any).assignments = [{
              bookingId: 'booking', tableId: 'old', tableNumber: '8', waiterId: 'waiter-1',
              waiterName: 'Олександр', assignedAt: new Date().toISOString(),
            }];

            service.moveBookingToTable('booking', 'new', '1');

            assert.equal((service as any).calls[0].status, 'new');
            assert.equal((service as any).calls[0].tableId, 'new');
            assert.equal((service as any).calls[0].tableNumber, '1');
            assert.equal((service as any).assignments[0].tableId, 'new');
          });

          test('myAssignments restores the waiter table from persisted history', async () => {
            const booking = {
              id: 'booking', status: 'approved', checkedInAt: new Date(), updatedAt: new Date(),
              table: { id: 'table-1', tableNumber: '1', status: 'occupied' },
            } as any;
            const bookings = { find: async () => [booking] };
            const histories = historyRepository({
              actorStaffId: 'waiter-1', actorName: 'Олександр', createdAt: new Date(),
            });
            const service = new WaiterCallsService(bookings as any, histories as any);

            const result = await service.myAssignments('waiter-1');

            assert.equal(result.length, 1);
            assert.equal(result[0].bookingId, booking.id);
            assert.equal(result[0].tableNumber, '1');
          });

          test('accept rejects a waiter when a new call is assigned to another waiter', async () => {
            const service = new WaiterCallsService({} as any, historyRepository() as any);
            (service as any).calls = [{
              id: 'call', bookingId: 'booking', tableId: 'table-1', tableNumber: '1', clientName: null,
              waiterId: 'waiter-1', waiterName: 'Офіціант 1', status: 'new', createdAt: new Date().toISOString(),
              acceptedAt: null, closedAt: null,
            }];

            await assert.rejects(
              () => service.accept('call', { waiterId: 'waiter-2', waiterName: 'Офіціант 2' }),
              (error: any) => error.getStatus() === 403,
            );
            assert.equal((service as any).calls[0].status, 'new');
          });

          test('accept persists the waiter assignment', async () => {
            const booking = { id: 'booking', table: { id: 'table-1', tableNumber: '1' } } as any;
            const bookings = { findOne: async () => booking };
            const saved: any[] = [];
            const histories = historyRepository();
            histories.save = async (value: any) => { saved.push(value); return value; };
            const service = new WaiterCallsService(bookings as any, histories as any);
            (service as any).calls = [{
              id: 'call', bookingId: 'booking', tableId: 'table-1', tableNumber: '1', clientName: null,
              waiterId: null, waiterName: null, status: 'new', createdAt: new Date().toISOString(),
              acceptedAt: null, closedAt: null,
            }];

            const result = await service.accept('call', { waiterId: 'waiter-1', waiterName: 'Олександр' });

            assert.equal(result.call.status, 'accepted');
            assert.equal(saved[0].action, 'waiter_assigned');
            assert.equal(saved[0].actorStaffId, 'waiter-1');
          });

          test('close rejects a new call until it has been accepted', () => {
            const service = new WaiterCallsService({} as any, historyRepository() as any);
            (service as any).calls = [{
              id: 'call', bookingId: 'booking', tableId: 'table-1', tableNumber: '1', clientName: null,
              waiterId: null, waiterName: null, status: 'new', createdAt: new Date().toISOString(),
              acceptedAt: null, closedAt: null,
            }];
            assert.throws(() => service.close('call', 'waiter-1'), /Спочатку прийміть виклик/);
          });
          '''
          Path('backend/src/waiter-calls/waiter-calls.service.spec.ts').write_text(waiter_spec, encoding='utf-8')
          PY

      - name: Verify, commit and clean workflow
        shell: bash
        run: |
          set +e
          report=waiter-fix-report.txt
          : > "$report"
          overall=0
          run_check() {
            name="$1"
            shift
            echo "===== $name =====" >> "$report"
            "$@" >> "$report" 2>&1
            code=$?
            echo "exit=$code" >> "$report"
            echo >> "$report"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          run_check "backend install" npm --prefix backend install --include=dev --package-lock=false --no-audit --no-fund
          run_check "frontend install" npm --prefix frontend install --package-lock=false --no-audit --no-fund
          run_check "backend build" npm --prefix backend run build
          run_check "frontend build" npm --prefix frontend run build
          run_check "backend focused tests" bash -lc 'cd backend && node --test -r ts-node/register src/bookings/bookings.service.spec.ts src/waiter-calls/waiter-calls.service.spec.ts'
          run_check "diff check" git diff --check

          rm -f .github/workflows/export-waiter-fix-source.yml
          git config user.name "MOLO Fix Bot"
          git config user.email "actions@github.com"
          if [ "$overall" -eq 0 ]; then
            rm -f "$report"
            message="Fix waiter table state synchronization"
          else
            message="WIP waiter table state synchronization diagnostics"
          fi
          git add -A
          git commit -m "$message"
          git push origin HEAD:fix/waiter-table-state-sync
