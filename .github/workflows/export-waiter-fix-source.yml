                                ),'''
          new_checkin_action = '''                            () => bookingsApi.checkIn(b.id),'''
          if old_checkin_action not in waiter_app:
              raise SystemExit('frontend checkIn action block not found')
          waiter_app = waiter_app.replace(old_checkin_action, new_checkin_action)
          old_modal_text = '''              <p className="mt-2 text-white/60">
                Оберіть вільний стіл для бронювання.
              </p>
              <div className="mt-4 grid grid-cols-2 gap-2">
                {tables.map((t) => ('''
          new_modal_text = '''              <p className="mt-2 text-white/60">
                Оберіть вільний стіл для бронювання. Столи відсортовані за номером.
              </p>
              {error && (
                <p className="mt-3 rounded-2xl border border-red-300/40 p-3 text-red-100">
                  {error}
                </p>
              )}
              <div className="mt-4 grid grid-cols-2 gap-2">
                {tables.length ? tables.map((t) => ('''
          if old_modal_text not in waiter_app:
              raise SystemExit('transfer modal header block not found')
          waiter_app = waiter_app.replace(old_modal_text, new_modal_text)
          waiter_app = waiter_app.replace(
              '''                ))}
              </div>
            </div>
          </div>
        )}''',
              '''                )) : (
                  <p className="col-span-2 text-white/60">
                    Немає вільних столів потрібної місткості.
                  </p>
                )}
              </div>
            </div>
          </div>
        )}''',
              1,
          )
          waiter_app_path.write_text(waiter_app, encoding='utf-8')

          bookings_spec = r'''import { strict as assert } from 'node:assert';
          import { test } from 'node:test';
          import { BookingsService } from './bookings.service';
          import { Booking } from './entities/booking.entity';
          import { BookingHistory } from './entities/booking-history.entity';
          import { TableEntity } from '../tables/entities/table.entity';

          function queryBuilder<T>(value: T) {
            return {
              leftJoinAndSelect() { return this; },
              where() { return this; },
              setLock() { return this; },
              getOne: async () => value,
            };
          }

          function createService(booking: Booking, oldTable: TableEntity, nextTable: TableEntity) {
            const savedTables: TableEntity[][] = [];
            const moved: Array<{ bookingId: string; tableId: string; tableNumber: string }> = [];
            const manager = {
              getRepository: (entity: unknown) => {
                if (entity === Booking) {
                  return {
                    createQueryBuilder: () => queryBuilder(booking),
                    save: async () => booking,
                  };
                }
                if (entity === TableEntity) {
                  let call = 0;
                  return {
                    createQueryBuilder: () => {
                      call += 1;
                      return queryBuilder(call === 1 ? nextTable : oldTable);
                    },
                    save: async (tables: TableEntity[]) => savedTables.push(tables),
                  };
                }
                if (entity === BookingHistory) {
                  return { create: (history: unknown) => history, save: async () => undefined };
                }
                throw new Error('Unexpected repository');
              },
            };

            const service = new BookingsService(
              { manager: { transaction: async (work: (value: typeof manager) => Promise<unknown>) => work(manager) } } as any,
              {} as any, {} as any, {} as any, {} as any, {} as any, {} as any, {} as any,
              {
                moveBookingToTable: (bookingId: string, tableId: string, tableNumber: string) => {
                  moved.push({ bookingId, tableId, tableNumber });
                },
              } as any,
            );
            (service as any).restaurantDateToday = () => '2026-07-23';
            (service as any).checkAvailability = async () => ({ isAvailable: true });
            (service as any).safeLog = async () => undefined;
            return { service, savedTables, moved };
          }

          test('waiterTransfer preserves unrelated occupied source for a not checked-in booking', async () => {
