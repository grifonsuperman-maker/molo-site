name: Apply waiter table state fixes

on:
  push:
    branches:
      - fix/waiter-table-state-sync

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/waiter-table-state-sync
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          waiter_service = r'''import { BadRequestException, ForbiddenException, Injectable, NotFoundException } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { IsNull, Not, Repository } from 'typeorm';

          import { Booking } from '../bookings/entities/booking.entity';
          import { BookingHistory } from '../bookings/entities/booking-history.entity';

          type WaiterCallStatus = 'new' | 'accepted' | 'closed';

          export type WaiterCall = {
            id: string;
            bookingId: string;
            tableId: string | null;
            tableNumber: string | null;
            clientName: string | null;
            waiterId: string | null;
            waiterName: string | null;
            status: WaiterCallStatus;
            createdAt: string;
            acceptedAt: string | null;
            closedAt: string | null;
          };

          type WaiterAssignment = {
            bookingId: string;
            tableId: string | null;
            tableNumber: string | null;
            waiterId: string;
            waiterName: string;
            assignedAt: string;
          };

          @Injectable()
          export class WaiterCallsService {
            private calls: WaiterCall[] = [];
            private assignments: WaiterAssignment[] = [];

            constructor(
              @InjectRepository(Booking)
              private readonly bookings: Repository<Booking>,
              @InjectRepository(BookingHistory)
              private readonly histories: Repository<BookingHistory>,
            ) {}

            private now() {
              return new Date().toISOString();
            }

            private makeId() {
              return `call_${Date.now()}_${Math.random().toString(16).slice(2)}`;
            }

            private async getBooking(bookingId: string) {
              const booking = await this.bookings.findOne({
                where: { id: bookingId },
                relations: ['table', 'client'],
              });

              if (!booking) throw new NotFoundException('Бронювання не знайдено');
              return booking;
            }

            private findMemoryAssignment(booking: Booking) {
              const tableId = booking.table?.id || null;
              const tableNumber = booking.table?.tableNumber || null;

              return [...this.assignments]
                .reverse()
                .find((assignment) => {
                  if (assignment.bookingId === booking.id) return true;
                  if (tableId && assignment.tableId === tableId) return true;
                  if (tableNumber && assignment.tableNumber === tableNumber) return true;
                  return false;
                }) || null;
            }

            private async findPersistedAssignment(booking: Booking): Promise<WaiterAssignment | null> {
              const history = await this.histories
                .createQueryBuilder('history')
                .leftJoin('history.booking', 'booking')
                .where('booking.id = :bookingId', { bookingId: booking.id })
                .andWhere('history.action IN (:...actions)', {
                  actions: ['waiter_assigned', 'booking_checked_in'],
                })
                .andWhere('history.actorStaffId IS NOT NULL')
                .orderBy('history.createdAt', 'DESC')
                .getOne();

              if (!history?.actorStaffId) return null;

              return {
                bookingId: booking.id,
                tableId: booking.table?.id || null,
                tableNumber: booking.table?.tableNumber || null,
                waiterId: history.actorStaffId,
                waiterName: history.actorName || 'Офіціант',
                assignedAt: new Date(history.createdAt).toISOString(),
              };
            }

            private async findAssignment(booking: Booking) {
              return this.findMemoryAssignment(booking) || this.findPersistedAssignment(booking);
            }

            private rememberAssignment(
              booking: Booking,
              waiterId: string,
              waiterName: string,
              assignedAt = this.now(),
            ) {
              const assignment: WaiterAssignment = {
                bookingId: booking.id,
                tableId: booking.table?.id || null,
                tableNumber: booking.table?.tableNumber || null,
                waiterId,
                waiterName: waiterName || 'Офіціант',
                assignedAt,
              };

              this.assignments = this.assignments.filter(
                (item) =>
                  item.bookingId !== assignment.bookingId &&
                  (!assignment.tableId || item.tableId !== assignment.tableId) &&
                  (!assignment.tableNumber || item.tableNumber !== assignment.tableNumber),
              );
              this.assignments.push(assignment);
              return assignment;
            }

            private async persistAssignment(booking: Booking, assignment: WaiterAssignment) {
              await this.histories.save(
                this.histories.create({
                  booking,
                  action: 'waiter_assigned',
                  actorRole: 'waiter',
                  actorStaffId: assignment.waiterId,
                  actorName: assignment.waiterName,
                  previousData: null,
                  newData: {
                    tableId: assignment.tableId,
                    tableNumber: assignment.tableNumber,
                    assignedAt: assignment.assignedAt,
                  },
                  reason: null,
                  isManualMode: true,
                }),
              );
            }

            async assign(dto: {
              bookingId: string;
              tableId?: string | null;
              tableNumber?: string | null;
              waiterId: string;
              waiterName: string;
            }) {
              if (!dto.bookingId) throw new BadRequestException('bookingId обовʼязковий');
              if (!dto.waiterId) throw new BadRequestException('waiterId обовʼязковий');

              const booking = await this.getBooking(dto.bookingId);
              const assignment = this.rememberAssignment(
                {
                  ...booking,
                  table: booking.table
                    ? {
                        ...booking.table,
                        id: dto.tableId || booking.table.id,
                        tableNumber: dto.tableNumber || booking.table.tableNumber,
                      }
                    : booking.table,
                },
                dto.waiterId,
                dto.waiterName,
              );
              await this.persistAssignment(booking, assignment);

              return {
                message: 'Офіціанта закріплено за столом',
                assignment,
              };
            }

            async guestStatus(bookingId: string) {
              const booking = await this.getBooking(bookingId);
              const tableStatus = booking.table?.status || null;
              const canCall = booking.status === 'approved' && tableStatus === 'occupied';

              const activeCall =
                this.calls.find(
                  (call) => call.bookingId === booking.id && call.status !== 'closed',
                ) || null;

              const assignment = await this.findAssignment(booking);

              return {
                bookingId: booking.id,
                tableNumber: booking.table?.tableNumber || null,
                bookingStatus: booking.status,
                tableStatus,
                canCall,
                waiterAssigned: Boolean(assignment),
                waiterName: assignment?.waiterName || null,
                activeCall,
              };
            }

            async createFromGuest(dto: { bookingId: string }) {
              if (!dto.bookingId) throw new BadRequestException('bookingId обовʼязковий');

              const booking = await this.getBooking(dto.bookingId);
              const status = await this.guestStatus(booking.id);

              if (!status.canCall) {
                throw new BadRequestException('Виклик офіціанта доступний тільки після приходу гостя за стіл');
              }

              const existing = this.calls.find(
                (call) => call.bookingId === booking.id && call.status !== 'closed',
              );

              if (existing) {
                return {
                  message: 'Виклик вже відправлено',
                  call: existing,
                };
              }

              const assignment = await this.findAssignment(booking);
              const call: WaiterCall = {
                id: this.makeId(),
                bookingId: booking.id,
                tableId: booking.table?.id || null,
                tableNumber: booking.table?.tableNumber || null,
                clientName: booking.client?.fullName || null,
                waiterId: assignment?.waiterId || null,
                waiterName: assignment?.waiterName || null,
                status: 'new',
                createdAt: this.now(),
                acceptedAt: null,
                closedAt: null,
              };

              this.calls.unshift(call);

              return {
                message: assignment
                  ? `Виклик відправлено офіціанту ${assignment.waiterName}`
                  : 'Виклик відправлено у загальний список офіціантів',
                call,
              };
            }

            list(waiterId?: string) {
              const active = this.calls.filter((call) => call.status !== 'closed');
              if (!waiterId) return active;
              return active.filter((call) => !call.waiterId || call.waiterId === waiterId);
            }

            async myAssignments(waiterId: string) {
              if (!waiterId) return [];

              const activeBookings = await this.bookings.find({
                where: {
                  status: 'approved',
                  checkedInAt: Not(IsNull()),
                },
                relations: ['table'],
                order: { updatedAt: 'DESC' },
                take: 200,
              });

              const result: WaiterAssignment[] = [];
              for (const booking of activeBookings) {
                const assignment = await this.findAssignment(booking);
                if (assignment?.waiterId === waiterId) result.push(assignment);
                if (result.length >= 50) break;
              }
              return result;
            }

            detachBooking(bookingId: string) {
              this.assignments = this.assignments.filter((assignment) => assignment.bookingId !== bookingId);
            }

            moveBookingToTable(bookingId: string, tableId: string, tableNumber: string) {
              for (const call of this.calls) {
                if (call.bookingId === bookingId && call.status !== 'closed') {
                  call.tableId = tableId;
                  call.tableNumber = tableNumber;
                }
              }

              for (const assignment of this.assignments) {
                if (assignment.bookingId === bookingId) {
                  assignment.tableId = tableId;
                  assignment.tableNumber = tableNumber;
                }
              }
            }

            closeActiveCallsAndDetachBooking(bookingId: string) {
              const closedAt = this.now();
              for (const call of this.calls) {
                if (call.bookingId === bookingId && (call.status === 'new' || call.status === 'accepted')) {
                  call.status = 'closed';
                  call.closedAt = closedAt;
                }
              }
              this.detachBooking(bookingId);
            }

            async accept(id: string, dto: { waiterId: string; waiterName: string }) {
              const call = this.calls.find((item) => item.id === id);
              if (!call) throw new NotFoundException('Виклик не знайдено');
              if (call.status === 'closed') throw new BadRequestException('Виклик вже закрито');
              if (!dto.waiterId) throw new BadRequestException('waiterId обовʼязковий');
              if (call.waiterId && call.waiterId !== dto.waiterId) {
                throw new ForbiddenException('Цей виклик призначено іншому офіціанту');
              }
              if (call.status === 'accepted') {
                return { message: 'Виклик вже прийнято', call };
              }

              call.status = 'accepted';
              call.waiterId = dto.waiterId;
              call.waiterName = dto.waiterName || 'Офіціант';
              call.acceptedAt = this.now();

              const booking = await this.getBooking(call.bookingId);
              const assignment = this.rememberAssignment(
                booking,
                dto.waiterId,
                dto.waiterName,
                call.acceptedAt,
              );
              await this.persistAssignment(booking, assignment);

              return { message: 'Виклик прийнято', call };
            }

            close(id: string, waiterId: string) {
              const call = this.calls.find((item) => item.id === id);
              if (!call) throw new NotFoundException('Виклик не знайдено');
              if (call.status === 'closed') throw new BadRequestException('Виклик вже закрито');
              if (call.status !== 'accepted') throw new BadRequestException('Спочатку прийміть виклик');
              if (!waiterId) throw new BadRequestException('waiterId обовʼязковий');
              if (call.waiterId !== waiterId) {
                throw new ForbiddenException('Цей виклик призначено іншому офіціанту');
              }

              call.status = 'closed';
              call.closedAt = this.now();
              return { message: 'Виклик закрито', call };
            }
          }
          '''
          Path('backend/src/waiter-calls/waiter-calls.service.ts').write_text(waiter_service, encoding='utf-8')

          module_path = Path('backend/src/waiter-calls/waiter-calls.module.ts')
          module = module_path.read_text(encoding='utf-8')
          module = module.replace(
              "import { Booking } from '../bookings/entities/booking.entity';\n",
              "import { Booking } from '../bookings/entities/booking.entity';\nimport { BookingHistory } from '../bookings/entities/booking-history.entity';\n",
          ).replace(
              'imports: [TypeOrmModule.forFeature([Booking])],',
              'imports: [TypeOrmModule.forFeature([Booking, BookingHistory])],',
          )
          module_path.write_text(module, encoding='utf-8')

          controller_path = Path('backend/src/bookings/bookings.controller.ts')
          controller = controller_path.read_text(encoding='utf-8')
          old_checkin = """  checkIn(@Param('id') id: string) {
              return this.service.checkIn(id);
            }
          """
          new_checkin = """  checkIn(@Param('id') id: string, @Req() request: any) {
              return this.service.checkIn(id, request.user);
            }
          """
          if old_checkin not in controller:
              raise SystemExit('checkIn controller block not found')
          controller_path.write_text(controller.replace(old_checkin, new_checkin), encoding='utf-8')

          bookings_path = Path('backend/src/bookings/bookings.service.ts')
          bookings = bookings_path.read_text(encoding='utf-8')
          checkin_start = bookings.index('  async checkIn(id: string) {')
          checkin_end = bookings.index('\n  async complete(id: string)', checkin_start)
          new_checkin_service = r'''  async checkIn(id: string, actor?: AuthUser) {
            const booking = await this.bookings.findOne({ where: { id }, relations: ['table', 'client'] });
            if (!booking) throw new NotFoundException('Бронювання не знайдено');

            const previousData = this.bookingSnapshot(booking);
            booking.status = 'approved';
            if (!booking.approvedAt) booking.approvedAt = new Date();
            if (!booking.checkedInAt) booking.checkedInAt = new Date();
            await this.bookings.save(booking);
            await this.saveHistory(booking, 'booking_checked_in', actor?.role || 'admin', previousData, this.bookingSnapshot(booking));
            await this.setTableStatusOnlyForToday(booking.table, 'occupied', booking.bookingDate, true);
            if (actor?.staffId) {
              await this.waiterCalls.assign({
                bookingId: booking.id,
                tableId: booking.table?.id || null,
                tableNumber: booking.table?.tableNumber || null,
                waiterId: actor.staffId,
                waiterName: actor.name || 'Офіціант',
              });
            }
            await this.safeLog('Гості прийшли', { bookingId: id, waiterId: actor?.staffId || null });
            return { message: 'Гості відмічені як присутні' };
          }
          '''
          bookings = bookings[:checkin_start] + new_checkin_service + bookings[checkin_end:]

          transfer_start = bookings.index('  /** Moves an approved booking')
          transfer_end = bookings.index('\n  async requestReschedule', transfer_start)
          new_transfer = r'''  /** Moves an approved booking while preserving the active visit and waiter assignment. */
          async waiterTransfer(id: string, tableId: string, actor: AuthUser) {
            if (!tableId) throw new BadRequestException('Оберіть новий стіл');

            const result = await this.bookings.manager.transaction(async (manager) => {
              const booking = await manager
                .getRepository(Booking)
                .createQueryBuilder('booking')
                .leftJoinAndSelect('booking.table', 'table')
                .leftJoinAndSelect('booking.client', 'client')
                .where('booking.id = :id', { id })
                .setLock('pessimistic_write', undefined, ['booking'])
                .getOne();
              if (!booking || booking.status !== 'approved' || !booking.table) {
                throw new BadRequestException('Пересадка доступна лише для підтвердженого бронювання');
              }
              if (booking.bookingDate !== this.restaurantDateToday()) {
                throw new BadRequestException('Пересадка через пульт офіціанта доступна лише для бронювання на сьогодні');
              }

              const tableRepository = manager.getRepository(TableEntity);
              const nextTable = await tableRepository
                .createQueryBuilder('table')
                .where('table.id = :tableId', { tableId })
                .setLock('pessimistic_write')
                .getOne();
              if (!nextTable || !nextTable.isVisible || nextTable.status !== 'free') {
                throw new BadRequestException('Обраний стіл закритий або зайнятий');
              }
              if (nextTable.id === booking.table.id) throw new BadRequestException('Оберіть інший стіл');
              if (Number(nextTable.seats) < Number(booking.guestsCount)) {
                throw new BadRequestException('Обраний стіл не вміщує всіх гостей');
              }

              const availability = await this.checkAvailability({
                tableId: nextTable.id,
                bookingDate: booking.bookingDate,
                bookingTime: booking.bookingTime,
                durationMinutes: booking.durationMinutes,
              } as CheckAvailabilityDto);
              if (!availability.isAvailable) {
                throw new BadRequestException('Цей стіл має конфлікт у часі бронювання');
              }

              const oldTable = await tableRepository
                .createQueryBuilder('table')
                .where('table.id = :oldTableId', { oldTableId: booking.table.id })
                .setLock('pessimistic_write')
                .getOne();
              if (!oldTable) throw new BadRequestException('Попередній стіл не знайдено');

              const previousData = this.bookingSnapshot(booking);
              const checkedIn = Boolean(booking.checkedInAt);
              booking.table = nextTable;
              await manager.getRepository(Booking).save(booking);

              if (booking.bookingDate === this.restaurantDateToday()) {
                if (
                  oldTable.status !== 'closed' &&
                  (checkedIn || !['occupied', 'cleaning'].includes(oldTable.status))
                ) {
                  oldTable.status = 'free';
                }
                nextTable.status = checkedIn ? 'occupied' : 'reserved';
                await tableRepository.save([oldTable, nextTable]);
              }

              await manager.getRepository(BookingHistory).save(
                manager.getRepository(BookingHistory).create({
                  booking,
                  action: 'waiter_table_transfer',
                  actorRole: actor.role,
                  actorStaffId: actor.staffId || null,
                  actorName: actor.name || null,
                  previousData,
                  newData: this.bookingSnapshot(booking),
                  reason: `Стіл №${oldTable.tableNumber} → №${nextTable.tableNumber}`,
                  isManualMode: true,
                }),
              );
              await this.safeLog('Пересадка гостей', {
                bookingId: booking.id,
                oldTable: oldTable.tableNumber,
                newTable: nextTable.tableNumber,
                author: actor.name || actor.staffId || null,
              });

              return {
                message: 'Гостей пересаджено на новий стіл',
                tableId: nextTable.id,
                tableNumber: nextTable.tableNumber,
              };
            });

            this.waiterCalls.moveBookingToTable(id, result.tableId, result.tableNumber);
            return { message: result.message };
          }
          '''
          bookings = bookings[:transfer_start] + new_transfer + bookings[transfer_end:]
          bookings_path.write_text(bookings, encoding='utf-8')

          waiter_app_path = Path('frontend/src/waiter/WaiterApp.tsx')
          waiter_app = waiter_app_path.read_text(encoding='utf-8')
          waiter_app = waiter_app.replace(
              'const time = (v?: string | null) => String(v || "--:--").slice(0, 5);',
              'const time = (v?: string | null) => String(v || "--:--").slice(0, 5);\nconst tableOrder = (value: string | number) => {\n  const number = Number(value);\n  return Number.isFinite(number) ? number : Number.MAX_SAFE_INTEGER;\n};',
          )
          old_transfer_load = '''      setTables(
                (await tablesApi.getAll()).filter(
                  (t) => t.status === "free" && t.isVisible,
                ),
              );'''
          new_transfer_load = '''      setTables(
                (await tablesApi.getAll())
                  .filter(
                    (t) =>
                      t.status === "free" &&
                      t.isVisible &&
                      Number(t.seats) >= Number(b.guestsCount),
