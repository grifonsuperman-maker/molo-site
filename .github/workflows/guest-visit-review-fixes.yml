name: Apply guest visit review fixes

on:
  push:
    branches:
      - fix/guest-visit-identity
    paths:
      - .github/workflows/guest-visit-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/guest-visit-identity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply scoped review patch
        run: python3 scripts/apply_guest_visit_review_fixes.py
      - name: Remove temporary patch files
        run: |
          rm .github/workflows/guest-visit-review-fixes.yml
          rm .github/workflows/guest-visit-review-fixes-run.yml
          rm scripts/apply_guest_visit_review_fixes.py
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build backend
        run: npm --prefix backend run build
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test backend
        run: npm --prefix backend test
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: git diff --check
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            backend/src/bookings/bookings.service.ts \
            backend/src/bookings/client-visit-stats.ts \
            backend/src/bookings/guest-telegram-link.service.ts \
            backend/test/guest-visit-stats.test.js \
            backend/test/guest-telegram-completed-reassign.test.js \
            .github/workflows/guest-visit-review-fixes.yml \
            .github/workflows/guest-visit-review-fixes-run.yml \
            scripts/apply_guest_visit_review_fixes.py
          git diff --cached --check
          git commit -m "fix: make guest visit stats consistent"
          git show --check HEAD
          git push origin HEAD:fix/guest-visit-identity
