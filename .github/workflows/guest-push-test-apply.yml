name: Guest Push TEST migration (apply test only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type apply-guest-push-subscriptions-to-test-push-migration exactly; TEST BRANCH ONLY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: guest-push-test-migration
  cancel-in-progress: false

jobs:
  apply-to-test-branch:
    # This job never runs for PRs, pushes, production refs or other repositories.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'grifonsuperman-maker/molo-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit TEST-only confirmation before accessing database credentials
        env:
          APPROVAL: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPROVAL" != 'apply-guest-push-subscriptions-to-test-push-migration' ]]; then
            echo '::error::Test-only approval phrase does not match; no database connection attempted.'
            exit 1
          fi
      - name: Check out reviewed main without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; pinned full commit SHA
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7; pinned full commit SHA
        with:
          node-version: 24
      - name: Install backend dependencies (no database credentials)
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend (no database credentials)
        run: npm --prefix backend run build
      - name: Recheck the existing TEST database read-only baseline
        shell: bash
        env:
          DB_URL: ${{ secrets.MOLO_TEST_PUSH_DB_URL }}
          MOLO_PUSH_EXPECTED_HOST: ${{ vars.MOLO_TEST_PUSH_EXPECTED_HOST }}
          MOLO_PUSH_BRANCH: test-push-migration
          DB_SYNCHRONIZE: 'false'
        run: |
          set -euo pipefail
          if [[ -z "$DB_URL" || -z "$MOLO_PUSH_EXPECTED_HOST" ]]; then
            echo '::error::Test read-only secret or independently verified test host is missing; no migration executed.'
            exit 1
          fi
          node backend/scripts/guest-push-migration-operator.mjs --check
      - name: Apply and verify exactly one TypeORM migration on TEST only
        shell: bash
        env:
          DB_URL: ${{ secrets.MOLO_TEST_PUSH_APPLY_DB_URL }}
          MOLO_PUSH_EXPECTED_HOST: ${{ vars.MOLO_TEST_PUSH_EXPECTED_HOST }}
          MOLO_PUSH_BRANCH: test-push-migration
          MOLO_PUSH_APPROVAL: ${{ inputs.confirmation }}
          DB_SYNCHRONIZE: 'false'
        run: |
          set -euo pipefail
          if [[ -z "$DB_URL" || -z "$MOLO_PUSH_EXPECTED_HOST" ]]; then
            echo '::error::Dedicated TEST-only migration secret or test host missing; no migration executed.'
            exit 1
          fi
          node backend/scripts/guest-push-test-apply.mjs
