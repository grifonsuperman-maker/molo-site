name: Baseline operator checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: baseline-operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: molo_fresh_schema_reference
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d molo_fresh_schema_reference"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      FRESH_SCHEMA_REFERENCE_ALLOW: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: molo_fresh_schema_reference
      DB_SYNCHRONIZE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Initialize disposable current schema
        run: node backend/scripts/fresh-schema-reference.mjs
      - name: Reject public operator during adoption
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'CREATE OPERATOR public.=== (FUNCTION = pg_catalog.int4eq, LEFTARG = integer, RIGHTARG = integer);'
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted a public operator.' >&2
            exit 1
          fi
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Operator rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP OPERATOR public.=== (integer, integer);'
      - name: Reject public operator family and class during adoption
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OPERATOR FAMILY public.__baseline_family_probe USING btree;
          CREATE OPERATOR CLASS public.__baseline_int4_ops
          FOR TYPE integer USING btree FAMILY public.__baseline_family_probe AS
            OPERATOR 1 < (integer, integer),
            OPERATOR 2 <= (integer, integer),
            OPERATOR 3 = (integer, integer),
            OPERATOR 4 >= (integer, integer),
            OPERATOR 5 > (integer, integer),
            FUNCTION 1 pg_catalog.btint4cmp(integer, integer);
          SQL
          class_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_opclass c JOIN pg_namespace n ON n.oid = c.opcnamespace WHERE n.nspname = 'public' AND c.opcname = '__baseline_int4_ops'")"
          family_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_opfamily f JOIN pg_namespace n ON n.oid = f.opfnamespace WHERE n.nspname = 'public' AND f.opfname = '__baseline_family_probe'")"
          if [ "$class_rows" != "1" ] || [ "$family_rows" != "1" ]; then
            echo 'Operator family/class probe was not created.' >&2
            exit 1
          fi
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted a public operator family/class.' >&2
            exit 1
          fi
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Operator family/class rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP OPERATOR CLASS public.__baseline_int4_ops USING btree;' \
            -c 'DROP OPERATOR FAMILY public.__baseline_family_probe USING btree;'
      - name: Validate exact adoption after operator cleanup
        run: node backend/scripts/initial-schema-baseline-validation.mjs adopt
      - name: Reset disposable database for fresh operator guard
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS molo_fresh_schema_reference WITH (FORCE);' \
            -c 'CREATE DATABASE molo_fresh_schema_reference;'
      - name: Reject public operator on fresh path
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'CREATE OPERATOR public.=== (FUNCTION = pg_catalog.int4eq, LEFTARG = integer, RIGHTARG = integer);'
          if node backend/scripts/initial-schema-baseline-validation.mjs fresh; then
            echo 'Initial baseline unexpectedly accepted a public operator on fresh path.' >&2
            exit 1
          fi
          operator_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_operator o JOIN pg_namespace n ON n.oid = o.oprnamespace WHERE n.nspname = 'public' AND o.oprname = '===' AND o.oprleft = 'integer'::regtype AND o.oprright = 'integer'::regtype")"
          if [ "$operator_rows" != "1" ]; then
            echo 'Rejected fresh baseline unexpectedly changed the pre-existing operator.' >&2
            exit 1
          fi
      - name: Reset disposable database for fresh family guard
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS molo_fresh_schema_reference WITH (FORCE);' \
            -c 'CREATE DATABASE molo_fresh_schema_reference;'
      - name: Reject public operator family and class on fresh path
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OPERATOR FAMILY public.__baseline_family_probe USING btree;
          CREATE OPERATOR CLASS public.__baseline_int4_ops
          FOR TYPE integer USING btree FAMILY public.__baseline_family_probe AS
            OPERATOR 1 < (integer, integer),
            OPERATOR 2 <= (integer, integer),
            OPERATOR 3 = (integer, integer),
            OPERATOR 4 >= (integer, integer),
            OPERATOR 5 > (integer, integer),
            FUNCTION 1 pg_catalog.btint4cmp(integer, integer);
          SQL
          if node backend/scripts/initial-schema-baseline-validation.mjs fresh; then
            echo 'Initial baseline unexpectedly accepted a public operator family/class on fresh path.' >&2
            exit 1
          fi
          class_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_opclass c JOIN pg_namespace n ON n.oid = c.opcnamespace WHERE n.nspname = 'public' AND c.opcname = '__baseline_int4_ops'")"
          family_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_opfamily f JOIN pg_namespace n ON n.oid = f.opfnamespace WHERE n.nspname = 'public' AND f.opfname = '__baseline_family_probe'")"
          if [ "$class_rows" != "1" ] || [ "$family_rows" != "1" ]; then
            echo 'Rejected fresh baseline unexpectedly changed the pre-existing operator family/class.' >&2
            exit 1
          fi
      - name: Reset disposable database for clean bootstrap
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS molo_fresh_schema_reference WITH (FORCE);' \
            -c 'CREATE DATABASE molo_fresh_schema_reference;'
      - name: Validate clean fresh bootstrap and revert
        run: |
          node backend/scripts/initial-schema-baseline-validation.mjs fresh
          node backend/scripts/initial-schema-baseline-validation.mjs revert
