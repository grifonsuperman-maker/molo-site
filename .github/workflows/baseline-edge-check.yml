name: Baseline edge checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: baseline-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: molo_fresh_schema_reference
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d molo_fresh_schema_reference"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      FRESH_SCHEMA_REFERENCE_ALLOW: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: molo_fresh_schema_reference
      DB_SYNCHRONIZE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Initialize disposable current schema
        run: node backend/scripts/fresh-schema-reference.mjs
      - name: Reject generated column during adoption
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE zones ADD COLUMN __baseline_generated_probe integer GENERATED ALWAYS AS (1) STORED;'
          generated_state="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT is_generated FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'zones' AND column_name = '__baseline_generated_probe'")"
          if [ "$generated_state" != "ALWAYS" ]; then
            echo "Generated-column probe was not generated: $generated_state" >&2
            exit 1
          fi
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted a generated column.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE zones DROP COLUMN __baseline_generated_probe;'
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Generated-column rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
      - name: Reject runtime role missing table INSERT privilege
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE __baseline_runtime_probe LOGIN PASSWORD 'baseline-probe';" \
            -c 'GRANT CONNECT ON DATABASE molo_fresh_schema_reference TO __baseline_runtime_probe;' \
            -c 'GRANT USAGE ON SCHEMA public TO __baseline_runtime_probe;' \
            -c 'GRANT SELECT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO __baseline_runtime_probe;' \
            -c 'GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO __baseline_runtime_probe;'
          probe_insert="$(PGPASSWORD='baseline-probe' psql -h "$DB_HOST" -p "$DB_PORT" -U __baseline_runtime_probe -d "$DB_NAME" -Atc "SELECT has_table_privilege(current_user, 'public.bookings', 'INSERT')::text")"
          if [ "$probe_insert" != "false" ]; then
            echo "Limited runtime role unexpectedly has INSERT: $probe_insert" >&2
            exit 1
          fi
          if DB_USER=__baseline_runtime_probe DB_PASSWORD=baseline-probe node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted a runtime role without INSERT.' >&2
            exit 1
          fi
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Runtime-privilege rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP OWNED BY __baseline_runtime_probe;' \
            -c 'DROP ROLE __baseline_runtime_probe;'
      - name: Reject changed column collation during adoption
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE clients ALTER COLUMN full_name TYPE character varying COLLATE "C";'
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted changed column collation.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE clients ALTER COLUMN full_name TYPE character varying COLLATE "default";'
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Column-collation rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
      - name: Reject public materialized view during adoption
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'CREATE MATERIALIZED VIEW public.__baseline_matview_probe AS SELECT 1 AS value WITH NO DATA;'
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted a materialized view.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP MATERIALIZED VIEW public.__baseline_matview_probe;'
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Materialized-view rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
      - name: Reject revoked uuid-ossp execution privilege during adoption
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'REVOKE EXECUTE ON FUNCTION public.uuid_generate_v4() FROM PUBLIC;'
          public_execute="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_proc p CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) a WHERE p.oid = 'public.uuid_generate_v4()'::regprocedure AND a.grantee = 0 AND a.privilege_type = 'EXECUTE'")"
          if [ "$public_execute" != "0" ]; then
            echo 'Privilege probe did not revoke PUBLIC execute.' >&2
            exit 1
          fi
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted revoked uuid-ossp execution privilege.' >&2
            exit 1
          fi
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'uuid-ossp privilege rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'GRANT EXECUTE ON FUNCTION public.uuid_generate_v4() TO PUBLIC;'
      - name: Reject modified uuid-ossp function during adoption
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc \
            "SELECT pg_get_functiondef('public.uuid_generate_v4()'::regprocedure)" > /tmp/uuid_generate_v4.sql
          printf '\n;\n' >> /tmp/uuid_generate_v4.sql
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION public.uuid_generate_v4()
          RETURNS uuid
          LANGUAGE sql
          VOLATILE
          AS $$ SELECT '00000000-0000-0000-0000-000000000000'::uuid $$;
          SQL
          extension_membership="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_depend d JOIN pg_extension e ON e.oid = d.refobjid WHERE d.classid = 'pg_proc'::regclass AND d.objid = 'public.uuid_generate_v4()'::regprocedure AND d.refclassid = 'pg_extension'::regclass AND d.deptype = 'e' AND e.extname = 'uuid-ossp'")"
          if [ "$extension_membership" != "1" ]; then
            echo 'uuid_generate_v4 probe unexpectedly changed extension membership.' >&2
            exit 1
          fi
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted a modified uuid-ossp function.' >&2
            exit 1
          fi
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'uuid-ossp rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f /tmp/uuid_generate_v4.sql
      - name: Validate exact current-schema adoption after cleanup
        run: node backend/scripts/initial-schema-baseline-validation.mjs adopt
      - name: Reset disposable database for stale-history guard
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS molo_fresh_schema_reference WITH (FORCE);' \
            -c 'CREATE DATABASE molo_fresh_schema_reference;'
      - name: Reject stale TypeORM history on fresh path
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE public.migrations (id SERIAL PRIMARY KEY, "timestamp" bigint NOT NULL, name character varying NOT NULL);' \
            -c "INSERT INTO public.migrations (\"timestamp\", name) VALUES (1, 'ForeignMigration0000000000001');"
          if node backend/scripts/initial-schema-baseline-validation.mjs fresh; then
            echo 'Initial baseline unexpectedly accepted stale TypeORM migration history.' >&2
            exit 1
          fi
          stale_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM public.migrations WHERE name = 'ForeignMigration0000000000001'")"
          if [ "$stale_rows" != "1" ]; then
            echo 'Rejected fresh baseline unexpectedly changed stale migration history.' >&2
            exit 1
          fi
      - name: Reset disposable database for clean fresh bootstrap
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS molo_fresh_schema_reference WITH (FORCE);' \
            -c 'CREATE DATABASE molo_fresh_schema_reference;'
      - name: Validate clean fresh bootstrap and revert
        run: |
          node backend/scripts/initial-schema-baseline-validation.mjs fresh
          node backend/scripts/initial-schema-baseline-validation.mjs revert
