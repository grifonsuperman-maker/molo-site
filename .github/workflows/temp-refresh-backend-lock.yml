name: Temporary backend lock refresh

on:
  push:
    branches: [chore/update-nestjs-typeorm]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/update-nestjs-typeorm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh backend lockfile
        run: npm --prefix backend install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify exact adapter and removed nested uuid
        run: |
          node - <<'NODE'
          const lock = require('./backend/package-lock.json');
          const adapter = lock.packages['node_modules/@nestjs/typeorm'];
          if (!adapter || adapter.version !== '11.0.3') throw new Error('Expected @nestjs/typeorm 11.0.3');
          if (lock.packages['node_modules/@nestjs/typeorm/node_modules/uuid']) throw new Error('Nested uuid still present');
          NODE
      - name: Reproducible backend install
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test backend
        run: npm --prefix backend test
      - name: Remove temporary workflow and commit lockfile
        run: |
          rm .github/workflows/temp-refresh-backend-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json .github/workflows/temp-refresh-backend-lock.yml
          git diff --cached --check
          git commit -m "Синхронізувати backend lockfile для TypeORM адаптера"
          git push origin HEAD:chore/update-nestjs-typeorm
