name: Apply guest visit identity fix

on:
  push:
    branches:
      - fix/guest-visit-identity
    paths:
      - .github/workflows/guest-visit-identity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/guest-visit-identity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply scoped backend patch
        run: echo '' | base64 -d | python3
      - name: Remove temporary workflow
        run: rm .github/workflows/guest-visit-identity-patch.yml
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build backend
        run: npm --prefix backend run build
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test backend
        run: npm --prefix backend test
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: git diff --check
      - name: Commit scoped fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/test/guest-visit-stats.test.js .github/workflows/guest-visit-identity-patch.yml
          git commit -m "fix: count repeat guest visits by stable identity"
          git show --check HEAD
          git push origin HEAD:fix/guest-visit-identity
