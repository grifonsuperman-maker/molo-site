name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test table changes
        run: npm --prefix backend test

  database-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: molo_fresh_schema_reference
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d molo_fresh_schema_reference"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      FRESH_SCHEMA_REFERENCE_ALLOW: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: molo_fresh_schema_reference
      DB_SYNCHRONIZE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Initialize disposable fresh schema
        run: node backend/scripts/fresh-schema-reference.mjs
      - name: Capture fresh schema audit
        run: node backend/scripts/schema-audit.mjs > fresh-schema-audit.json
      - name: Normalize fresh schema baseline
        run: node backend/scripts/schema-baseline.mjs fresh-schema-audit.json > fresh-schema-baseline.json
      - name: Rewind registered runtime migrations
        run: node backend/scripts/runtime-migration-roundtrip.mjs rewind
      - name: Capture pre-runtime schema audit
        run: node backend/scripts/schema-audit.mjs > pre-runtime-schema-audit.json
      - name: Normalize pre-runtime schema baseline
        run: node backend/scripts/schema-baseline.mjs pre-runtime-schema-audit.json > pre-runtime-schema-baseline.json
      - name: Reapply registered runtime migrations
        run: node backend/scripts/runtime-migration-roundtrip.mjs forward
      - name: Capture roundtrip schema audit
        run: node backend/scripts/schema-audit.mjs > roundtrip-schema-audit.json
      - name: Normalize roundtrip schema baseline
        run: node backend/scripts/schema-baseline.mjs roundtrip-schema-audit.json > roundtrip-schema-baseline.json
      - name: Verify runtime migration schema roundtrip
        run: node backend/scripts/schema-roundtrip-compare.mjs fresh-schema-baseline.json roundtrip-schema-baseline.json
      - name: Prepare current-schema object reference
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('fresh-schema-baseline.json', 'utf8'));
          delete snapshot.typeOrmMigrations;
          fs.writeFileSync('fresh-schema-baseline-objects.json', JSON.stringify(snapshot));
          NODE
      - name: Verify adoption rejects schema drift
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE bookings ADD COLUMN "__baseline_drift_probe" text;'
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted schema drift.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE bookings DROP COLUMN "__baseline_drift_probe";'
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Failed adoption unexpectedly wrote baseline migration history.' >&2
            exit 1
          fi
      - name: Verify adoption rejects RLS and policies
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE bookings ENABLE ROW LEVEL SECURITY;' \
            -c 'ALTER TABLE bookings FORCE ROW LEVEL SECURITY;' \
            -c 'CREATE POLICY "__baseline_rls_probe" ON bookings USING (true);'
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted RLS/policy drift.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP POLICY "__baseline_rls_probe" ON bookings;' \
            -c 'ALTER TABLE bookings NO FORCE ROW LEVEL SECURITY;' \
            -c 'ALTER TABLE bookings DISABLE ROW LEVEL SECURITY;'
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'RLS rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
      - name: Verify adoption rejects invalid active-booking index
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP INDEX "UQ_bookings_active_guest_device_date";' \
            -c "INSERT INTO bookings (booking_date, booking_time, guests_count, guest_device_id_hash) VALUES (CURRENT_DATE, '12:00', 2, 'baseline-invalid-index-probe'), (CURRENT_DATE, '13:00', 2, 'baseline-invalid-index-probe');"
          if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c "CREATE UNIQUE INDEX CONCURRENTLY \"UQ_bookings_active_guest_device_date\" ON public.bookings USING btree (booking_date, guest_device_id_hash) WHERE ((guest_device_id_hash IS NOT NULL) AND (status = ANY (ARRAY['pending'::bookings_status_enum, 'approved'::bookings_status_enum])));"; then
            echo 'Invalid-index probe unexpectedly built a valid unique index.' >&2
            exit 1
          fi
          index_state="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT indisvalid::text || ':' || indisready::text FROM pg_index WHERE indexrelid = '\"UQ_bookings_active_guest_device_date\"'::regclass")"
          if [ -z "$index_state" ] || [ "$index_state" = "true:true" ]; then
            echo "Invalid-index probe did not leave an invalid/not-ready index: $index_state" >&2
            exit 1
          fi
          if node backend/scripts/initial-schema-baseline-validation.mjs adopt; then
            echo 'Baseline adoption unexpectedly accepted an invalid active-booking index.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP INDEX IF EXISTS "UQ_bookings_active_guest_device_date";' \
            -c "DELETE FROM bookings WHERE guest_device_id_hash = 'baseline-invalid-index-probe';" \
            -c "CREATE UNIQUE INDEX \"UQ_bookings_active_guest_device_date\" ON public.bookings USING btree (booking_date, guest_device_id_hash) WHERE ((guest_device_id_hash IS NOT NULL) AND (status = ANY (ARRAY['pending'::bookings_status_enum, 'approved'::bookings_status_enum])));"
          baseline_rows="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM migrations WHERE name = 'InitialSchemaBaseline2026081300000'")"
          if [ "$baseline_rows" != "0" ]; then
            echo 'Invalid-index rejection unexpectedly wrote baseline history.' >&2
            exit 1
          fi
      - name: Validate baseline adoption on exact existing schema
        run: node backend/scripts/initial-schema-baseline-validation.mjs adopt
      - name: Capture adopted schema audit
        run: node backend/scripts/schema-audit.mjs > adopted-schema-audit.json
      - name: Normalize adopted schema baseline
        run: node backend/scripts/schema-baseline.mjs adopted-schema-audit.json > adopted-schema-baseline.json
      - name: Verify adoption leaves schema objects unchanged
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('adopted-schema-baseline.json', 'utf8'));
          delete snapshot.typeOrmMigrations;
          fs.writeFileSync('adopted-schema-baseline-objects.json', JSON.stringify(snapshot));
          NODE
          node backend/scripts/schema-roundtrip-compare.mjs fresh-schema-baseline-objects.json adopted-schema-baseline-objects.json
      - name: Revert adopted baseline history without touching schema
        run: node backend/scripts/initial-schema-baseline-validation.mjs revert-adopted
      - name: Capture adopted-reverted schema audit
        run: node backend/scripts/schema-audit.mjs > adopted-reverted-schema-audit.json
      - name: Normalize adopted-reverted schema baseline
        run: node backend/scripts/schema-baseline.mjs adopted-reverted-schema-audit.json > adopted-reverted-schema-baseline.json
      - name: Verify adopted revert preserves schema objects
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('adopted-reverted-schema-baseline.json', 'utf8'));
          delete snapshot.typeOrmMigrations;
          fs.writeFileSync('adopted-reverted-schema-baseline-objects.json', JSON.stringify(snapshot));
          NODE
          node backend/scripts/schema-roundtrip-compare.mjs fresh-schema-baseline-objects.json adopted-reverted-schema-baseline-objects.json
      - name: Reset disposable database for partial-schema guard
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS molo_fresh_schema_reference WITH (FORCE);' \
            -c 'CREATE DATABASE molo_fresh_schema_reference;'
      - name: Verify baseline refuses unrelated pre-existing table and data
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE staff_pin_attempts (id bigint PRIMARY KEY, sentinel text NOT NULL);' \
            -c "INSERT INTO staff_pin_attempts (id, sentinel) VALUES (1, 'keep-me');"
          if node backend/scripts/initial-schema-baseline-validation.mjs fresh; then
            echo 'Initial baseline unexpectedly accepted a non-empty database.' >&2
            exit 1
          fi
          sentinel="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc 'SELECT sentinel FROM staff_pin_attempts WHERE id = 1')"
          if [ "$sentinel" != "keep-me" ]; then
            echo 'Rejected baseline modified pre-existing data.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP TABLE staff_pin_attempts;'
      - name: Verify baseline refuses standalone custom type
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'CREATE DOMAIN public.positive_int AS integer CHECK (VALUE > 0);'
          if node backend/scripts/initial-schema-baseline-validation.mjs fresh; then
            echo 'Initial baseline unexpectedly accepted a standalone custom type.' >&2
            exit 1
          fi
          domain_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace WHERE n.nspname = 'public' AND t.typname = 'positive_int'")"
          if [ "$domain_exists" != "1" ]; then
            echo 'Rejected baseline unexpectedly removed the pre-existing domain.' >&2
            exit 1
          fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'DROP DOMAIN public.positive_int;'
      - name: Verify baseline refuses pre-existing public collation
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'CREATE COLLATION public.baseline_probe FROM pg_catalog."C";'
          if node backend/scripts/initial-schema-baseline-validation.mjs fresh; then
            echo 'Initial baseline unexpectedly accepted a public collation.' >&2
            exit 1
          fi
          collation_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Atc "SELECT COUNT(*) FROM pg_collation c JOIN pg_namespace n ON n.oid = c.collnamespace WHERE n.nspname = 'public' AND c.collname = 'baseline_probe'")"
          if [ "$collation_exists" != "1" ]; then
            echo 'Rejected baseline unexpectedly removed the pre-existing collation.' >&2
            exit 1
          fi
      - name: Reset disposable database for baseline bootstrap
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS molo_fresh_schema_reference WITH (FORCE);' \
            -c 'CREATE DATABASE molo_fresh_schema_reference;'
      - name: Build fresh schema from initial baseline plus runtime migrations
        run: node backend/scripts/initial-schema-baseline-validation.mjs fresh
      - name: Capture baseline-built schema audit
        run: node backend/scripts/schema-audit.mjs > baseline-built-schema-audit.json
      - name: Normalize baseline-built schema
        run: node backend/scripts/schema-baseline.mjs baseline-built-schema-audit.json > baseline-built-schema-baseline.json
      - name: Verify baseline-built schema matches current schema objects
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('baseline-built-schema-baseline.json', 'utf8'));
          delete snapshot.typeOrmMigrations;
          fs.writeFileSync('baseline-built-schema-objects.json', JSON.stringify(snapshot));
          NODE
          node backend/scripts/schema-roundtrip-compare.mjs fresh-schema-baseline-objects.json baseline-built-schema-objects.json
      - name: Verify full fresh migration down path
        run: node backend/scripts/initial-schema-baseline-validation.mjs revert
      - name: Upload migration baseline reference
        uses: actions/upload-artifact@v4
        with:
          name: migration-baseline-reference
          path: |
            fresh-schema-audit.json
            fresh-schema-baseline.json
            pre-runtime-schema-audit.json
            pre-runtime-schema-baseline.json
            roundtrip-schema-audit.json
            roundtrip-schema-baseline.json
            adopted-schema-audit.json
            adopted-schema-baseline.json
            adopted-reverted-schema-audit.json
            adopted-reverted-schema-baseline.json
            baseline-built-schema-audit.json
            baseline-built-schema-baseline.json
          if-no-files-found: error
          retention-days: 7
