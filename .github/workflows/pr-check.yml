name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check origin/main...HEAD
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test table changes
        run: npm --prefix backend test

  database-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: molo_fresh_schema_reference
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d molo_fresh_schema_reference"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      FRESH_SCHEMA_REFERENCE_ALLOW: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: molo_fresh_schema_reference
      DB_SYNCHRONIZE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Initialize disposable fresh schema
        run: node backend/scripts/fresh-schema-reference.mjs
      - name: Validate Syrve link constraints and concurrent writes
        run: node backend/scripts/syrve-table-link-validation.mjs
      - name: Validate Syrve mapping confirmation and configuration fencing
        run: node backend/scripts/syrve-mapping-validation.mjs
      - name: Validate physical map identity and immutable UUID bindings
        run: node backend/scripts/table-map-identity-validation.mjs
      - name: Validate UUID table renaming and concurrent number conflicts
        run: node backend/scripts/syrve-table-renaming-validation.mjs
      - name: Validate durable Syrve state, restarts and concurrent writes
        run: node backend/scripts/syrve-state-storage-validation.mjs
      - name: Validate transactional staff actions and offline Syrve bindings
        run: node backend/scripts/syrve-staff-actions-validation.mjs
      - name: Validate unified status reads and disabled Syrve projection
        run: node backend/scripts/syrve-status-projection-validation.mjs
      - name: Validate disabled Syrve worker, leases, retries and delayed responses
        run: node backend/scripts/syrve-worker-validation.mjs
      - name: Validate explicit table loading, one-use confirmation and cross-instance leases
        run: node backend/scripts/syrve-table-loading-validation.mjs
      - name: Validate read-only Syrve readiness and schema preflight
        run: node backend/scripts/syrve-readiness-validation.mjs
      - name: Rebuild and bind Syrve application artifacts to the clean checkout
        run: node backend/scripts/syrve-application-build.mjs --build
      - name: Validate reviewed Syrve application plans and preservation for every prefix
        run: node backend/scripts/syrve-schema-application-validation.mjs
      - name: Validate isolated banquet table assignment migration
        run: node backend/scripts/booking-table-assignments-validation.mjs
      - name: Capture fresh schema audit
        run: node backend/scripts/schema-audit.mjs > fresh-schema-audit.json
      - name: Normalize fresh schema baseline
        run: node backend/scripts/schema-baseline.mjs fresh-schema-audit.json > fresh-schema-baseline.json
      - name: Rewind registered runtime migrations
        run: node backend/scripts/runtime-migration-roundtrip.mjs rewind
      - name: Capture pre-runtime schema audit
        run: node backend/scripts/schema-audit.mjs > pre-runtime-schema-audit.json
      - name: Normalize pre-runtime schema baseline
        run: node backend/scripts/schema-baseline.mjs pre-runtime-schema-audit.json > pre-runtime-schema-baseline.json
      - name: Reapply registered runtime migrations
        run: node backend/scripts/runtime-migration-roundtrip.mjs forward
      - name: Capture roundtrip schema audit
        run: node backend/scripts/schema-audit.mjs > roundtrip-schema-audit.json
      - name: Normalize roundtrip schema baseline
        run: node backend/scripts/schema-baseline.mjs roundtrip-schema-audit.json > roundtrip-schema-baseline.json
      - name: Verify runtime migration schema roundtrip
        run: node backend/scripts/schema-roundtrip-compare.mjs fresh-schema-baseline.json roundtrip-schema-baseline.json
      - name: Upload migration baseline reference
        uses: actions/upload-artifact@v4
        with:
          name: migration-baseline-reference
          path: |
            fresh-schema-audit.json
            fresh-schema-baseline.json
            pre-runtime-schema-audit.json
            pre-runtime-schema-baseline.json
            roundtrip-schema-audit.json
            roundtrip-schema-baseline.json
          if-no-files-found: error
          retention-days: 7

  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check current HEAD and whitespace
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
          git diff --check "$BASE_SHA" HEAD
          git show --check HEAD
      - name: Verify protected map assets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: git diff --exit-code "$BASE_SHA" HEAD -- frontend/public
