name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect backend install result
        id: backend_install
        shell: bash
        run: |
          set +e
          npm --prefix backend install --package-lock=false --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org > /tmp/backend-install.log 2>&1
          status=$?
          error=$(grep -E 'npm (ERR!|error)|ERESOLVE|ETARGET|EAI_AGAIN|ECONNRESET|ENOTFOUND' /tmp/backend-install.log | tail -n 1 | tr '\n\r' '  ' | cut -c1-180)
          if [ -z "$error" ]; then
            error=$(tail -n 1 /tmp/backend-install.log | tr '\n\r' '  ' | cut -c1-180)
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "error=$error" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Backend install — ${{ steps.backend_install.outputs.error }}
        run: test "${{ steps.backend_install.outputs.status }}" = "0"
      - name: Build backend
        run: cd backend && npx --yes @nestjs/cli@10.4.9 build
      - name: Test table changes
        run: npm --prefix backend test
