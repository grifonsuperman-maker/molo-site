name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test table changes
        run: npm --prefix backend test
