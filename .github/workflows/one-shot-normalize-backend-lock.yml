name: One-shot normalize backend lockfile

on:
  push:
    branches:
      - chore/normalize-backend-lockfile

permissions:
  contents: write

jobs:
  normalize-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/normalize-backend-lockfile
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Normalize only internal resolved URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/package-lock.json')
          original = path.read_text()
          pattern = re.compile(r'https://packages\.applied-caas-gateway[^/]+/artifactory/api/npm/npm-public/')
          normalized, count = pattern.subn('https://registry.npmjs.org/', original)
          if count == 0:
              raise SystemExit('No internal resolved URLs found')
          if 'applied-caas-gateway' in normalized:
              raise SystemExit('An internal resolved URL remains after normalization')
          path.write_text(normalized)
          print(f'Normalized {count} resolved URL(s) without changing package metadata')
          PY
      - name: Verify exact npm ci
        run: npm --prefix backend ci
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test backend
        run: npm --prefix backend test
      - name: Remove one-shot workflow and commit lockfile
        run: |
          git rm .github/workflows/one-shot-normalize-backend-lock.yml
          git add backend/package-lock.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Нормалізувати backend lockfile для npm ci"
          git push origin HEAD:chore/normalize-backend-lockfile
