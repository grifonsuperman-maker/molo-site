name: Guest swipe modal guard once

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/guest-swipe-modal-guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply scoped guest swipe fix
        run: |
          python - <<'PY'
          from pathlib import Path

          guest_path = Path('frontend/src/guest/GuestApp.tsx')
          source = guest_path.read_text()

          old_start = """  function handleBackSwipeStart(event: TouchEvent<HTMLDivElement>) {
            backSwipeStart.current = null;
            if (step === 'home' || event.touches.length !== 1) return;
          """
          new_start = """  function handleBackSwipeStart(event: TouchEvent<HTMLDivElement>) {
            backSwipeStart.current = null;
            if (showMyBookings || externalReviewOffer) return;
            if (step === 'home' || event.touches.length !== 1) return;
          """

          if source.count(old_start) != 1:
            raise SystemExit('Expected guest swipe start block was not found exactly once')
          source = source.replace(old_start, new_start, 1)

          old_end = """    if (!start || step === 'home' || event.changedTouches.length !== 1) return;
          """
          new_end = """    if (!start || showMyBookings || externalReviewOffer || step === 'home' || event.changedTouches.length !== 1) return;
          """

          if source.count(old_end) != 1:
            raise SystemExit('Expected guest swipe end guard was not found exactly once')
          source = source.replace(old_end, new_end, 1)
          guest_path.write_text(source)

          test_path = Path('frontend/test/guest-back-navigation.test.cjs')
          test_source = test_path.read_text()
          addition = """

          test('guest back swipe does not move the page under an open guest modal', () => {
            assert.ok(source.includes(`if (showMyBookings || externalReviewOffer) return;`));
            assert.ok(source.includes(`if (!start || showMyBookings || externalReviewOffer || step === 'home' || event.changedTouches.length !== 1) return;`));
          });
          """

          marker = "test('guest back swipe does not move the page under an open guest modal'"
          if marker not in test_source:
            test_path.write_text(test_source.rstrip() + addition)
          PY

      - name: Run focused regression test
        run: node frontend/test/guest-back-navigation.test.cjs

      - name: Check whitespace
        run: git diff --check

      - name: Commit scoped fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/guest/GuestApp.tsx frontend/test/guest-back-navigation.test.cjs
          git commit -m "fix: block guest back swipe under modals"
          git push
