name: Director control center check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/director-compact-control-center-2026-07-24

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Check whitespace
        run: git diff --check origin/main...HEAD

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies including Nest CLI
        run: npm --prefix backend install --include=dev --package-lock=false --no-audit --no-fund
      - name: Build backend
        run: npm --prefix backend run build
