name: Director Syrve integration check

on:
  pull_request:
    branches:
      - codex/director-syrve-ci-base

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Build frontend
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run build 2>&1 | tee frontend-build.log
      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-syrve-frontend-build-log
          path: frontend-build.log
      - name: Check whitespace
        run: git diff --check origin/codex/director-syrve-ci-base...HEAD

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies including Nest CLI
        run: npm --prefix backend install --include=dev --package-lock=false --no-audit --no-fund
      - name: Build backend
        run: npm --prefix backend run build
