name: Temporary Nest CLI lock refresh

on:
  push:
    branches: [chore/update-nest-cli]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/update-nest-cli
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh backend lockfile
        run: npm --prefix backend install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify Nest CLI and removed glob 10.4.5
        run: |
          node - <<'NODE'
          const lock = require('./backend/package-lock.json');
          const cli = lock.packages['node_modules/@nestjs/cli'];
          if (!cli || cli.version !== '11.0.24') throw new Error('Expected @nestjs/cli 11.0.24');
          const oldGlob = Object.entries(lock.packages).find(([, pkg]) => pkg && pkg.version === '10.4.5' && pkg.resolved?.includes('/glob-'));
          if (oldGlob) throw new Error(`glob 10.4.5 still present at ${oldGlob[0]}`);
          NODE
      - name: Reproducible backend install
        run: npm --prefix backend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build backend with local CLI
        run: npm --prefix backend run build
      - name: Test backend
        run: npm --prefix backend test
      - name: Remove temporary workflow and commit lockfile
        run: |
          rm .github/workflows/temp-refresh-nest-cli-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json .github/workflows/temp-refresh-nest-cli-lock.yml
          git diff --cached --check
          git commit -m "Синхронізувати backend lockfile для Nest CLI 11"
          git push origin HEAD:chore/update-nest-cli
