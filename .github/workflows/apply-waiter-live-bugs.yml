name: Apply waiter live bug fixes

on:
  push:
    branches:
      - fix/waiter-live-bugs-20260725
    paths:
      - .github/scripts/apply_waiter_live_bugs.py
      - .github/workflows/apply-waiter-live-bugs.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/waiter-live-bugs-20260725
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply targeted fixes
        run: python .github/scripts/apply_waiter_live_bugs.py

      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund --package-lock=false

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install backend dependencies
        run: |
          npm --prefix backend install --include=dev --no-audit --no-fund --package-lock=false
          npm --prefix backend install --no-save @nestjs/cli@10.4.9 --no-audit --no-fund --package-lock=false

      - name: Build backend
        run: npm --prefix backend run build

      - name: Check diff
        run: git diff --check

      - name: Commit product changes
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/waiter/WaiterApp.tsx backend/src/bookings/bookings.controller.ts
          git commit -m "Fix waiter assignments and transfer locations"
          git push origin HEAD:fix/waiter-live-bugs-20260725
