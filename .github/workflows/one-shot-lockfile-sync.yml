name: One-shot backend lockfile sync

on:
  push:
    branches:
      - chore/update-nest-typeorm-adapter

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/update-nest-typeorm-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Regenerate backend lockfile only
        run: npm --prefix backend install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify adapter lock entries
        run: |
          node - <<'NODE'
          const lock = require('./backend/package-lock.json');
          if (lock.packages[''].dependencies['@nestjs/typeorm'] !== '^11.0.3') throw new Error('root @nestjs/typeorm range mismatch');
          if (lock.packages['node_modules/@nestjs/typeorm']?.version !== '11.0.3') throw new Error('resolved @nestjs/typeorm version mismatch');
          if (lock.packages['node_modules/@nestjs/typeorm/node_modules/uuid']) throw new Error('stale nested uuid remains');
          NODE
      - name: Verify npm ci
        run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Remove one-shot workflow and commit lockfile
        run: |
          git rm .github/workflows/one-shot-lockfile-sync.yml
          git add backend/package-lock.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Синхронізувати lockfile TypeORM адаптера"
          git push origin HEAD:chore/update-nest-typeorm-adapter
