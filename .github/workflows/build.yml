name: Build

on:
  push:
    branches:
      - main
      - fix/guest-actions-waiter-call-final-2026-07-24
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies from package.json
        run: npm install --include=dev --package-lock=false --legacy-peer-deps --no-audit --no-fund
      - name: Build backend
        id: backend_build
        shell: bash
        run: |
          set +e
          npm run build > backend-build.log 2>&1
          status=$?
          cat backend-build.log
          exit $status
      - name: Run backend tests
        shell: bash
        run: |
          mapfile -t tests < <(find src -name '*.spec.ts' -print)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No backend spec files found"
            exit 0
          fi
          node --test --require ts-node/register "${tests[@]}"
      - name: Upload backend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: backend/backend-build.log
          if-no-files-found: error
          retention-days: 1
