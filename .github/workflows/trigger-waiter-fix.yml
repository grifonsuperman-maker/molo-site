name: Trigger waiter table fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: waiter-table-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run-prepared-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/waiter-table-state-sync
          fetch-depth: 0

      - name: Run prepared scripts
        shell: bash
        run: |
          if [ ! -f .github/workflows/export-waiter-fix-source.yml ]; then
            echo "Prepared workflow already consumed."
            exit 0
          fi
          python -m pip install --quiet pyyaml
          python <<'PY'
          import pathlib
          import subprocess
          import yaml

          path = pathlib.Path('.github/workflows/export-waiter-fix-source.yml')
          document = yaml.safe_load(path.read_text(encoding='utf-8'))
          steps = document['jobs']['apply-and-verify']['steps']
          scripts = [step['run'] for step in steps if isinstance(step, dict) and step.get('run')]
          if len(scripts) != 2:
              raise SystemExit(f'Expected 2 prepared scripts, found {len(scripts)}')
          for index, script in enumerate(scripts, start=1):
              print(f'Running prepared script {index}/{len(scripts)}', flush=True)
              subprocess.run(['bash', '-lc', script], check=True)
          PY

      - name: Remove one-time trigger
        if: always()
        shell: bash
        run: |
          if [ -f .github/workflows/trigger-waiter-fix.yml ]; then
            git config user.name "MOLO Fix Bot"
            git config user.email "actions@github.com"
            rm -f .github/workflows/trigger-waiter-fix.yml
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Remove temporary waiter fix trigger"
              git push origin HEAD:fix/waiter-table-state-sync
            fi
          fi
