name: Temporary frontend lock refresh

on:
  push:
    branches: [chore/frontend-lockfile]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/frontend-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate frontend package-lock
        run: npm --prefix frontend install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify clean install
        run: npm --prefix frontend ci --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/temp-refresh-frontend-lock.yml
          git diff --cached --check
          git commit -m "Зафіксувати frontend dependencies lockfile"
          git push origin HEAD:chore/frontend-lockfile
