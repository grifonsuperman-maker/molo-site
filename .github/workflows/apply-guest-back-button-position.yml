name: Apply guest back button position

on:
  push:
    branches:
      - fix/guest-back-button-position

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Inspect branch state
        run: |
          git branch --show-current
          git log -1 --oneline
          git status --short

      - name: Apply scoped button position change
        run: python3 .github/scripts/apply-guest-back-button-position.py

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build backend
        run: npm --prefix backend run build

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend
        run: npm --prefix backend test

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Check diff
        run: git diff --check

      - name: Commit verified fix and remove one-off files
        run: |
          rm .github/workflows/apply-guest-back-button-position.yml
          rm .github/scripts/apply-guest-back-button-position.py
          git add frontend/src/guest/GuestApp.tsx frontend/test/guest-back-navigation.test.cjs .github/workflows/apply-guest-back-button-position.yml .github/scripts/apply-guest-back-button-position.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore guest back button position"
          git show --check HEAD
          git push origin HEAD:fix/guest-back-button-position
