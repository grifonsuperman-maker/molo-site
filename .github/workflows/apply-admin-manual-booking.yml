name: Apply admin manual booking patch

on:
  push:
    branches:
      - feat/admin-manual-booking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Apply scoped patch
        run: python .github/scripts/apply-admin-manual-booking.py
      - name: Remove temporary patch tooling
        run: rm .github/scripts/apply-admin-manual-booking.py .github/workflows/apply-admin-manual-booking.yml
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build backend
        run: npm --prefix backend run build
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test backend
        run: npm --prefix backend test
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Check whitespace
        run: git diff --check
      - name: Commit scoped change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: allow admin manual table bookings"
          git show --check HEAD
          git push origin HEAD:feat/admin-manual-booking
