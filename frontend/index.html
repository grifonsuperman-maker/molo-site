<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10100f" />
    <meta name="description" content="MOLO Restaurant — технічне обслуговування та оновлення версії до 18.10.2026." />
    <title>MOLO Restaurant — Технічне обслуговування</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        color: #f7f1df;
        background: radial-gradient(ellipse at 50% 22%, #292315 0%, #10100f 50%, #080808 100%);
      }

      main {
        width: min(100%, 580px);
        padding: clamp(32px, 7vw, 60px) clamp(24px, 6vw, 56px);
        border: 1px solid #6f6343;
        border-radius: 28px;
        background: linear-gradient(155deg, rgba(34, 30, 20, 0.95), rgba(13, 13, 12, 0.98) 58%);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.5), inset 0 1px rgba(239, 217, 154, 0.09);
        text-align: center;
      }

      .brand {
        margin: 0;
        color: #e7d19a;
        font-size: clamp(32px, 8vw, 44px);
        font-weight: 750;
        letter-spacing: 0.24em;
        line-height: 1.2;
        text-indent: 0.24em;
      }

      .brand-caption {
        margin: 8px 0 0;
        color: #a99a77;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
      }

      .divider {
        width: 64px;
        height: 1px;
        margin: 32px auto;
        background: #ad9561;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 5.5vw, 38px);
        font-weight: 700;
        line-height: 1.22;
        text-wrap: balance;
      }

      .description {
        margin: 22px 0 0;
        color: #c9c3b7;
        font-size: 16px;
        line-height: 1.7;
      }

      .return-date {
        margin: 28px 0 0;
        padding: 18px 16px;
        border: 1px solid #53482f;
        border-radius: 16px;
        background: rgba(210, 175, 100, 0.07);
        font-size: 16px;
        line-height: 1.6;
      }

      .return-date time {
        display: block;
        margin-top: 5px;
        color: #e7d19a;
        font-size: clamp(25px, 6vw, 34px);
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .thanks {
        margin: 28px 0 0;
        color: #c2b9a5;
        font-size: 14px;
      }

      @media (max-width: 380px) {
        body { padding: 14px; }
        main { border-radius: 22px; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="maintenance-title">
      <p class="brand">MOLO</p>
      <p class="brand-caption">RESTAURANT</p>
      <div class="divider" aria-hidden="true"></div>
      <h1 id="maintenance-title">Технічне обслуговування та оновлення версії</h1>
      <p class="description">На сайті проводяться технічні роботи. Онлайн-сервіс тимчасово недоступний.</p>
      <p class="return-date">
        Сайт відновить роботу
        <time datetime="2026-10-18">18.10.2026</time>
      </p>
      <p class="thanks">Дякуємо за розуміння!</p>
    </main>
  </body>
</html>
